<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#dropShadow)" />
  
  <!-- Inner Subtle Border -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  
  <!-- Document & Arrow Icon -->
  <g transform="translate(116, 116)">
    <!-- Document 1 (Image representation) -->
    <rect x="20" y="20" width="130" height="170" rx="16" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Mountain/Image glyph inside doc 1 -->
    <path d="M 40 140 L 70 100 L 95 130 L 115 110 L 135 140 Z" fill="#7C3AED" opacity="0.85" />
    <circle cx="60" cy="65" r="14" fill="#EF4444" opacity="0.85" />
    
    <!-- Dynamic Conversion Arrow -->
    <path d="M 120 170 C 150 200, 180 180, 200 150" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <polygon points="205,135 210,165 185,155" fill="#FFFFFF" />

    <!-- Document 2 (PDF representation) -->
    <rect x="130" y="90" width="140" height="180" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" />
    <!-- Red PDF badge -->
    <rect x="145" y="115" width="60" height="24" rx="6" fill="#EF4444" />
    <text x="175" y="132" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">PDF</text>
    <!-- Lines in PDF -->
    <line x1="145" y1="165" x2="245" y2="165" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" />
    <line x1="145" y1="190" x2="230" y2="190" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <line x1="145" y1="215" x2="210" y2="215" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
